version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    groups:
      backend-patch-minor:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-patch-minor:
        update-types:
          - "minor"
          - "patch"
    # Paused until their respective migrations are done deliberately. ESLint 9
    # drops .eslintrc for flat config (eslint.config.js), and Tailwind 4
    # replaces tailwind.config.js with CSS-first @theme config and rewires the
    # PostCSS/Vite plugins -- both break the build as isolated bumps and have
    # already been opened and closed more than once. Remove when migrating.
    ignore:
      - dependency-name: "eslint"
        versions: [">= 9"]
      - dependency-name: "tailwindcss"
        versions: [">= 4"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
