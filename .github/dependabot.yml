version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
    groups:
      backend-patch-minor:
        update-types:
          - "minor"
          - "patch"
    # Paused until the numpy 1.x -> 2.0 migration. These versions all require
    # numpy>=2, but the project pins numpy==1.26.4 (and pandas 2.1.4 itself
    # requires numpy<2 on Python 3.12), so pip cannot resolve them and every
    # group PR containing one has to be hand-pinned back. Patch/minor updates
    # below these floors still come through. Remove these entries as part of
    # the numpy 2.0 migration.
    ignore:
      - dependency-name: "scipy"
        versions: [">= 1.18"]
      - dependency-name: "shap"
        versions: [">= 0.50"]
      - dependency-name: "anndata"
        versions: [">= 0.13"]
      - dependency-name: "scanpy"
        versions: [">= 1.12.3"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "frontend"
    groups:
      frontend-patch-minor:
        update-types:
          - "minor"
          - "patch"
    # Paused until their respective migrations are done deliberately. ESLint 9
    # drops .eslintrc for flat config (eslint.config.js), and Tailwind 4
    # replaces tailwind.config.js with CSS-first @theme config and rewires the
    # PostCSS/Vite plugins -- both break the build as isolated bumps and have
    # already been opened and closed more than once. Remove when migrating.
    ignore:
      - dependency-name: "eslint"
        versions: [">= 9"]
      - dependency-name: "tailwindcss"
        versions: [">= 4"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "github-actions"
